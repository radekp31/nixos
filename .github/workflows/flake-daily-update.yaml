name: Update Flake Lock

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-flake:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: false

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Set up Cachix binary cache
        uses: cachix/cachix-action@v15
        with:
          name: radekp31-nixos
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update flake.lock
        run: nix flake update

      # flakes/compat carries its own lock, and the step above never reaches
      # it. Without this step that lock ages forever.
      - name: Update the nested compat lock
        run: nix flake update --flake ./flakes/compat

      - name: Format repository
        run: nix fmt

      # Name every lock. A bare `git diff --quiet flake.lock` reports no change
      # when only the nested lock moved, and the job then throws that update
      # away.
      - name: Check if any lock file changed
        id: check-changes
        run: |
          if git diff --quiet -- flake.lock flakes/compat/flake.lock; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Validate flake evaluation (build gate)
        if: steps.check-changes.outputs.changed == 'true'
        run: nix flake check --print-build-logs

      - name: Build all host system closures (build gate)
        if: steps.check-changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          hosts=$(nix eval '.#nixosConfigurations' \
            --apply 'cfgs: builtins.concatStringsSep " " (builtins.attrNames cfgs)' --raw)
          echo "Building hosts: $hosts"
          for host in $hosts; do
            echo "::group::Build $host"
            nix build ".#nixosConfigurations.${host}.config.system.build.toplevel" \
              --no-link --print-build-logs --fallback
            echo "::endgroup::"
          done

      - name: Create Pull Request
        if: steps.check-changes.outputs.changed == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.BOT_PAT }}
          commit-message: "chore: update flake.lock dependencies"
          title: "chore: daily flake.lock update"
          branch: chore/daily-flake-update
          delete-branch: true
          labels: |
            automation
            dependencies

      - name: Auto-approve
        if: steps.check-changes.outputs.changed == 'true'
        uses: hmarr/auto-approve-action@v3
        with:
          pull-request-number: ${{ steps.cpr.outputs.pull-request-number }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge Pull Request
        if: steps.check-changes.outputs.changed == 'true'
        run: gh pr merge ${{ steps.cpr.outputs.pull-request-number }} --merge --admin
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_PAT }}

      - name: Clean up branch if merge failed
        if: failure() && steps.check-changes.outputs.changed == 'true'
        run: |
          git push origin --delete chore/daily-flake-update || true
