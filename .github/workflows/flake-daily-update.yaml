name: Update Flake Lock

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-flake:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: false

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Set up Cachix binary cache
        uses: cachix/cachix-action@v15
        with:
          name: radekp31-nixos
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update inputs granularly
        run: |
          set -euo pipefail
          # Extract all input names from flake.nix
          inputs=$(nix flake metadata --json | jq -r '.locks.nodes.root.inputs | keys[]')
          
          for input in $inputs; do
            echo "::group::Attempting update for input: $input"
            # Create a temporary stash or branch checkpoint
            git checkout -b "temp-$input" || git checkout "temp-$input"
            
            if nix flake update "$input"; then
              # Test if system closures still build with this specific input updated
              if nix flake check --print-build-logs; then
                echo "Input $input updated successfully!"
                git commit -am "chore(flake): update $input" || true
              else
                echo "Build failed after updating $input. Reverting..."
                git reset --hard HEAD
              fi
            fi
            echo "::endgroup::"
          done

      - name: Check if lock file changed
        id: check-changes
        run: |
          if git diff --quiet flake.lock; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Validate flake evaluation (build gate)
        if: steps.check-changes.outputs.changed == 'true'
        run: nix flake check --print-build-logs

      - name: Build all host system closures (build gate)
        if: steps.check-changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          hosts=$(nix eval '.#nixosConfigurations' \
            --apply 'cfgs: builtins.concatStringsSep " " (builtins.attrNames cfgs)' --raw)
          echo "Building hosts: $hosts"
          for host in $hosts; do
            echo "::group::Build $host"
            nix build ".#nixosConfigurations.${host}.config.system.build.toplevel" \
              --no-link --print-build-logs
            echo "::endgroup::"
          done

      - name: Create Pull Request
        if: steps.check-changes.outputs.changed == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.BOT_PAT }}
          commit-message: "chore: update flake.lock dependencies"
          title: "chore: daily flake.lock update"
          branch: chore/daily-flake-update
          delete-branch: true
          labels: |
            automation
            dependencies

      - name: Auto-approve
        if: steps.check-changes.outputs.changed == 'true'
        uses: hmarr/auto-approve-action@v3
        with:
          pull-request-number: ${{ steps.cpr.outputs.pull-request-number }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge Pull Request
        if: steps.check-changes.outputs.changed == 'true'
        run: gh pr merge ${{ steps.cpr.outputs.pull-request-number }} --merge --admin
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_PAT }}

      - name: Clean up branch if merge failed
        if: failure() && steps.check-changes.outputs.changed == 'true'
        run: |
          git push origin --delete chore/daily-flake-update || true
