name: Update Flake Lock

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  update-flake:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          large-packages: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Set up Cachix binary cache
        uses: cachix/cachix-action@v15
        with:
          name: radekp31-nixos
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update flake.lock
        run: nix flake update

      # Each flake under flakes/ carries its own lock, and the step above
      # never reaches it. The loop finds every nested flake, so a new one is
      # never left out. flakes/tools was left out until 2026-11-06.
      - name: Update the nested locks
        run: |
          set -euo pipefail
          for flake in flakes/*/flake.nix; do
            nix flake update --flake "./$(dirname "$flake")"
          done

      # The hosts use the Nix from flake.lock (the default nix.package).
      # Put the Nix from the NEW lock on PATH, so the checks and the builds
      # below use the version that the hosts get after a rebuild.
      - name: Use the Nix version from flake.lock
        run: |
          nix_out=$(nix build --no-link --print-out-paths --inputs-from . 'nixpkgs#nix^out')
          "$nix_out/bin/nix" --version
          echo "$nix_out/bin" >> "$GITHUB_PATH"

      - name: Format repository
        run: nix fmt

      # Name every lock. A bare `git diff --quiet flake.lock` reports no change
      # when only a nested lock moved, and the job then throws that update
      # away. Git expands the quoted pattern, so it matches every nested lock.
      - name: Check if any lock file changed
        id: check-changes
        run: |
          if git diff --quiet -- flake.lock 'flakes/*/flake.lock'; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Validate flake evaluation (build gate)
        if: steps.check-changes.outputs.changed == 'true'
        run: nix flake check --print-build-logs

      - name: Build all host system closures (build gate)
        if: steps.check-changes.outputs.changed == 'true'
        run: |
          set -euo pipefail
          hosts=$(nix eval '.#nixosConfigurations' \
            --apply 'cfgs: builtins.concatStringsSep " " (builtins.attrNames cfgs)' --raw)
          echo "Building hosts: $hosts"
          for host in $hosts; do
            echo "::group::Build $host"
            nix build ".#nixosConfigurations.${host}.config.system.build.toplevel" \
              --no-link --print-build-logs --fallback
            echo "::endgroup::"
          done

      - name: Create Pull Request
        if: steps.check-changes.outputs.changed == 'true'
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.BOT_PAT }}
          commit-message: "chore: update flake.lock dependencies"
          title: "chore: daily flake.lock update"
          branch: chore/daily-flake-update
          delete-branch: true
          labels: |
            automation
            dependencies

      - name: Auto-approve
        if: steps.check-changes.outputs.changed == 'true'
        uses: hmarr/auto-approve-action@v3
        with:
          pull-request-number: ${{ steps.cpr.outputs.pull-request-number }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge Pull Request
        if: steps.check-changes.outputs.changed == 'true'
        run: gh pr merge ${{ steps.cpr.outputs.pull-request-number }} --merge --admin
        env:
          GITHUB_TOKEN: ${{ secrets.BOT_PAT }}

      - name: Clean up branch if merge failed
        if: failure() && steps.check-changes.outputs.changed == 'true'
        run: |
          git push origin --delete chore/daily-flake-update || true
