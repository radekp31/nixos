# Scan every push and every pull request for a committed secret.
#
# This is the only gate that runs on your own commits. The daily update
# workflow runs on a schedule, so it never sees them.
#
# gitleaks-action is free for a personal repository. An organization needs
# a GITLEAKS_LICENSE secret.
name: Secret scan

on:
  push:
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # gitleaks needs the full history to scan every commit.
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
