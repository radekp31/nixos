# INERT 2026-09-15. Nothing runs these hooks.
#
# pre-commit is not installed, and .git/hooks holds no hook at all. A hook
# file also lives outside git, so every clone needs a manual install and any
# commit skips it with --no-verify.
#
# Secret scanning now runs in .github/workflows/secret-scan.yaml. CI cannot
# be skipped or forgotten. Formatting is already covered by the treefmt gate
# inside `nix flake check`.
#
# To use this file anyway: install pre-commit, then run `pre-commit install`.

repos:
  - repo: local
    hooks:
      - id: nix-fmt
        name: nix fmt
        entry: nix fmt
        language: system
        pass_filenames: false
        stages: [pre-commit]
